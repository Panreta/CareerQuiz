<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>心理咨询师职业路径测评</title>
<style>
:root{
  --bg:#fbfaf7; --card:#ffffff; --border:#e6e4dc; --border-strong:#cfccc0;
  --text:#26221c; --text-2:#6b675c;
  --accent:#db2777; --accent-bg:#fce7f3; --accent-text:#9d174d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1b16; --card:#242319; --border:#3a382c; --border-strong:#4d4a3c;
    --text:#ece9df; --text-2:#a8a495;
    --accent:#f472b6; --accent-bg:#831843; --accent-text:#fbcfe8;
  }
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  display:flex; justify-content:center; align-items:center; padding:40px 16px; min-height:100vh;
}
.wrap{width:100%; max-width:460px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:30px 24px; animation:fade .35s ease;
}
@media (prefers-reduced-motion: reduce){.card{animation:none;}}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
h1{font-size:19px; font-weight:600; margin:0 0 6px; text-align:center;}
.sub{font-size:14px; color:var(--text-2); text-align:center; line-height:1.6; margin:0 0 22px;}
button{
  font-family:inherit; font-size:15px; cursor:pointer; border-radius:10px;
  border:1px solid var(--border); background:var(--card); color:var(--text);
  transition:border-color .15s, background .15s;
}
button:hover{border-color:var(--border-strong); background:var(--bg);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt{display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px;}
.primary{display:block; width:100%; text-align:center; padding:13px; font-weight:600; background:var(--accent); color:#fff; border:none;}
.primary:hover{opacity:.9; background:var(--accent);}
.dots{display:flex; justify-content:center; gap:5px; margin-bottom:18px; flex-wrap:wrap;}
.dot{width:6px; height:6px; border-radius:50%; background:var(--border-strong);}
.dot.active{background:var(--accent);}
.qtext{font-size:16px; font-weight:600; margin-bottom:16px;}
.label{font-size:13px; color:var(--text-2); margin-bottom:4px; margin-top:20px;}
.label:first-of-type{margin-top:0;}
ul.tips{padding-left:20px; margin:8px 0 0; font-size:14px; line-height:1.7;}
ul.tips li{margin-bottom:8px;}
.profile li{margin-bottom:10px;}
.profile li::marker{color:#db2777;}
.book-pick{margin-top:4px; font-size:12.5px; color:#8b5cf6; line-height:1.5;}
.books li::marker{color:#8b5cf6;}
.honest-note{
  margin-top:8px; padding:14px 16px; border-radius:10px;
  background:var(--bg); border-left:3px solid #d97706;
  font-size:13.5px; line-height:1.7; color:var(--text-2);
}
.loading{text-align:center; padding:48px 0; color:var(--text-2); font-size:14px;}
</style>
</head>
<body>
<div class="wrap"><div id="quiz-root"></div></div>
<script>
const questions = [
  { q: "你现在是高几？", opts: ["高一","高二","高三","已经高中毕业，准备上大学"] },
  { q: "朋友遇到烦心事，会主动来找你聊吗？", opts: ["经常，很多人愿意找我聊","偶尔，看情况","很少"] },
  { q: "看到别人难过或哭的时候，你通常会", opts: ["想办法安慰、陪着他","有点不知所措，但还是留在旁边","先给对方一点空间"] },
  { q: "自己遇到困扰的时候，你通常会", opts: ["找人聊一聊","自己消化，写日记或想清楚","做点别的事转移注意力（运动、爱好等）"] },
  { q: "你更喜欢", opts: ["一对一的深聊","一群人一起的热闹氛围","看心情，两种都可以"] },
  { q: "有没有读过心理学相关的书？", opts: ["读过一些，感觉还不错","完全没读过，从零开始","读过，但感觉太难懂了"] }
];

const bookPool = ["心理学与生活","自卑与超越","社会性动物","深度关系","登天的感觉","如何调节母婴关系","梦的解析","蛤蟆先生去看心理医生"];

const profile = [
  [
    { t: "还有很长的时间打基础，可以按自己的节奏慢慢积累，完全不用着急",
      b1: { book: "心理学与生活", why: "内容全面，时间够的话可以当成「地基」慢慢啃" },
      b2: { book: "自卑与超越", why: "阿德勒讲个体怎么在成长中建立自信，篇幅不长，也很适合现在慢慢读" } },
    { t: "时间还够，从现在开始有意识地积累经历，会比大多数同龄人更早起步",
      b1: { book: "自卑与超越", why: "阿德勒讲个体怎么在成长中建立自信和归属感，很适合这个阶段的自我探索" },
      b2: { book: "心理学与生活", why: "系统打基础，正好配合这一年多的准备时间" } },
    { t: "已经在思考这件事本身就说明你比很多同龄人更早开始规划，这是难得的清醒",
      b1: { book: "社会性动物", why: "视角比入门书更宽，适合已经认真在规划方向的人" },
      b2: { book: "登天的感觉", why: "真实个案记录，能帮你更早看清这行真实的样子" } },
    { t: "比刚开始想这件事的高一学生多了一些阅历，这份工作恰恰需要一点生活阅历做支撑",
      b1: { book: "深度关系", why: "需要一点阅历才能真正读懂，讲的是关系里更深层的心理" },
      b2: { book: "登天的感觉", why: "真实个案记录，阅历越多读起来越有共鸣" } }
  ],
  [
    { t: "很多人愿意对你打开心，说明你身上有让人放心的特质，这是共情力很重要的基础",
      b1: { book: "登天的感觉", why: "真实个案记录，适合已经有共情基础、想看真实咨询是什么样子的人" },
      b2: { book: "深度关系", why: "讲深层关系里的心理，跟你已经具备的这种「被信任感」很相关" } },
    { t: "懂得分辨什么时候该主动关心、什么时候该给别人空间，这种判断力本身就很珍贵",
      b1: { book: "心理学与生活", why: "系统打个基础，让你的判断力更有理论支撑" },
      b2: { book: "社会性动物", why: "讲人和人之间怎么互相影响，帮你理解这份判断力背后的原理" } },
    { t: "可能只是还没遇到愿意对你打开心的朋友——共情和倾听是可以练出来的技能，很多优秀的咨询师年轻时也不是「自来熟」的人",
      b1: { book: "自卑与超越", why: "整本书讲的就是怎么建立连接和归属感，很适合刚开始探索这方面的人" },
      b2: { book: "蛤蟆先生去看心理医生", why: "用故事讲情绪和关系，读起来没有压力，很适合当作起点" } }
  ],
  [
    { t: "愿意主动靠近别人的情绪，这是很直接的共情表现",
      b1: { book: "如何调节母婴关系", why: "讲的是最早期的情绪安抚是怎么发生的，帮你理解共情最底层的机制" },
      b2: { book: "登天的感觉", why: "真实个案记录，能看到这份靠近别人情绪的能力在真实咨询里是怎么用的" } },
    { t: "「愿意留下来」这件事本身就很珍贵——很多人第一反应是回避，具体的安慰技巧可以学，但这份愿意面对的心意练不出来",
      b1: { book: "蛤蟆先生去看心理医生", why: "用故事讲清楚情绪是怎么运作的，很适合还在摸索怎么应对情绪的人" },
      b2: { book: "心理学与生活", why: "系统讲情绪和心理机制，帮你把「愿意留下来」变成「知道怎么做」" } },
    { t: "懂得尊重别人的边界、不强行介入，这在咨询里恰恰是很重要的能力",
      b1: { book: "深度关系", why: "讲边界感和关系深浅的把握，跟你懂得留空间的直觉很契合" },
      b2: { book: "自卑与超越", why: "讲的是怎么在尊重别人的前提下建立健康的关系" } }
  ],
  [
    { t: "相信「说出来」是有用的，这正是咨询工作的核心信念",
      b1: { book: "深度关系", why: "讲的正是「说出来」为什么真的有用，跟你的处理方式正好呼应" },
      b2: { book: "登天的感觉", why: "真实个案记录，能看到「说出来」在真实咨询里具体是怎么发生的" } },
    { t: "有很强的自我觉察能力，这是成为好咨询师的重要基础——咨询师首先要能觉察自己",
      b1: { book: "梦的解析", why: "弗洛伊德的经典之作，讲的正是怎么通过内省理解潜意识里的想法，适合喜欢自己想清楚的人" },
      b2: { book: "如何调节母婴关系", why: "从最早期的情绪发展讲起，帮你理解自我觉察是怎么一步步形成的" } },
    { t: "有一套健康的情绪调节方式，这本身就是心理健康的体现，以后也能把这套经验用来帮别人",
      b1: { book: "心理学与生活", why: "里面有专门讲情绪调节的章节，可以了解这套方式背后的原理" },
      b2: { book: "蛤蟆先生去看心理医生", why: "用轻松的故事讲情绪调节，跟你这种健康的处理方式很搭" } }
  ],
  [
    { t: "心理咨询本身大多是一对一或小团体的深度沟通，这个偏好正好和工作形式匹配",
      b1: { book: "深度关系", why: "整本书都在讲一对一关系里的深层心理，跟你的偏好直接对应" },
      b2: { book: "梦的解析", why: "经典的深度心理分析著作，适合喜欢深入、不喜欢浮于表面的人" } },
    { t: "适应团体氛围的能力很吃香——以后可以往团体咨询、工作坊这类方向发展，也是很有需求的方向",
      b1: { book: "社会性动物", why: "讲群体心理和社会影响，适合喜欢团体氛围的人" },
      b2: { book: "心理学与生活", why: "覆盖面广，也讲了不少群体和社会心理的内容" } },
    { t: "灵活是很大的优势，以后能选择的咨询形式和工作场景也更多",
      b1: { book: "心理学与生活", why: "覆盖面广，个体和群体心理都讲到，适合灵活型的人" },
      b2: { book: "社会性动物", why: "视角够宽，配合你灵活的性格正好合适" } }
  ],
  [
    { t: "已经打了一点底子，接下来可以读得更深入一些",
      b1: { book: "社会性动物", why: "视角比入门书更宽，是经典科普，适合往深一点读" },
      b2: { book: "登天的感觉", why: "真实个案记录，比一般科普书更有深度" } },
    { t: "会因为纯粹的兴趣主动来了解这件事，这种自发的动机比任何基础都重要",
      b1: { book: "心理学与生活", why: "最经典的入门教材，虽然厚但写得很清楚" },
      b2: { book: "自卑与超越", why: "篇幅不长，用故事感很强的方式讲心理学，适合当作第一本书" } },
    { t: "敢啃硬骨头这件事本身值得肯定——看不懂只是因为教材是写给大学生的，不代表你不适合这个方向",
      b1: { book: "蛤蟆先生去看心理医生", why: "小说体的心理科普，门槛低很多，比教材友好得多" },
      b2: { book: "深度关系", why: "写作风格更轻松，比传统教材友好，也是很好的替代选择" } }
  ]
];

function pickBook(slot, used){
  if(!used.has(slot.b1.book)){ used.add(slot.b1.book); return slot.b1; }
  if(!used.has(slot.b2.book)){ used.add(slot.b2.book); return slot.b2; }
  for(let i=0;i<bookPool.length;i++){
    if(!used.has(bookPool[i])){ used.add(bookPool[i]); return { book: bookPool[i], why: "这本书也很适合现在的你，值得找机会读一读" }; }
  }
  return slot.b1;
}

const certNote = "很多培训机构会说「考个证就能当心理咨询师」——这基本不准确。2017年起国家已经取消了统一的「心理咨询师」资格考试，市面上大部分培训证书含金量很有限。真正被行业认可的路径是：本科（专业不限）→应用心理硕士（考研，2-3年）→读研期间和毕业后攒够被督导的实践小时数→申请中国心理学会的「注册心理师」。这条路比「考个证」长得多，但也扎实得多。";

let currentIndex = 0;
let answers = [];
const root = document.getElementById("quiz-root");

function showIntro(){
  currentIndex = 0; answers = [];
  root.innerHTML = '<div class="card">' +
    '<h1>心理咨询师职业路径测评</h1>' +
    '<p class="sub">回答6个小问题，看看你身上已经有哪些适合这条路的特质</p>' +
    '<button class="primary" onclick="startQuiz()">开始测评 →</button></div>';
}
function startQuiz(){ currentIndex = 0; answers = []; showQuestion(); }
function renderDots(){
  let out = '<div class="dots">';
  for(let i=0;i<questions.length;i++){ out += '<span class="dot' + (i===currentIndex?' active':'') + '"></span>'; }
  return out + '</div>';
}
function showQuestion(){
  const item = questions[currentIndex];
  let opts = '';
  item.opts.forEach(function(opt,i){ opts += '<button class="opt" onclick="selectAnswer(' + i + ')">' + opt + '</button>'; });
  root.innerHTML = '<div class="card">' + renderDots() + '<div class="qtext">' + item.q + '</div>' + opts + '</div>';
}
function selectAnswer(i){
  answers[currentIndex] = i;
  currentIndex++;
  if(currentIndex < questions.length){ showQuestion(); } else { showSubmitting(); }
}
function showSubmitting(){
  root.innerHTML = '<div class="card"><div class="loading">正在生成你的专属建议…</div></div>';
  setTimeout(showResult, 900);
}
function flowerGraphic(){
  return '<svg width="150" height="95" viewBox="0 0 150 95" style="display:block; margin:0 auto 18px;">' +
    '<ellipse cx="46" cy="80" rx="14" ry="7" fill="#86c99d" transform="rotate(-25 46 80)"/>' +
    '<ellipse cx="108" cy="82" rx="13" ry="6" fill="#9ed6af" transform="rotate(20 108 82)"/>' +
    '<ellipse cx="75" cy="86" rx="12" ry="6" fill="#86c99d" transform="rotate(-5 75 86)"/>' +
    '<g transform="translate(35,58)">' +
      '<ellipse cx="0" cy="-13" rx="6" ry="12" fill="#c4b5fd" transform="rotate(0)"/>' +
      '<ellipse cx="0" cy="-13" rx="6" ry="12" fill="#c4b5fd" transform="rotate(72)"/>' +
      '<ellipse cx="0" cy="-13" rx="6" ry="12" fill="#c4b5fd" transform="rotate(144)"/>' +
      '<ellipse cx="0" cy="-13" rx="6" ry="12" fill="#c4b5fd" transform="rotate(216)"/>' +
      '<ellipse cx="0" cy="-13" rx="6" ry="12" fill="#c4b5fd" transform="rotate(288)"/>' +
      '<circle cx="0" cy="0" r="6" fill="#fef3c7"/>' +
    '</g>' +
    '<g transform="translate(75,45)">' +
      '<ellipse cx="0" cy="-18" rx="8" ry="17" fill="#f472b6" transform="rotate(0)"/>' +
      '<ellipse cx="0" cy="-18" rx="8" ry="17" fill="#f472b6" transform="rotate(60)"/>' +
      '<ellipse cx="0" cy="-18" rx="8" ry="17" fill="#f472b6" transform="rotate(120)"/>' +
      '<ellipse cx="0" cy="-18" rx="8" ry="17" fill="#f472b6" transform="rotate(180)"/>' +
      '<ellipse cx="0" cy="-18" rx="8" ry="17" fill="#f472b6" transform="rotate(240)"/>' +
      '<ellipse cx="0" cy="-18" rx="8" ry="17" fill="#f472b6" transform="rotate(300)"/>' +
      '<circle cx="0" cy="0" r="8" fill="#fde047"/>' +
    '</g>' +
    '<g transform="translate(115,60)">' +
      '<ellipse cx="0" cy="-11" rx="5" ry="10" fill="#93c5fd" transform="rotate(0)"/>' +
      '<ellipse cx="0" cy="-11" rx="5" ry="10" fill="#93c5fd" transform="rotate(72)"/>' +
      '<ellipse cx="0" cy="-11" rx="5" ry="10" fill="#93c5fd" transform="rotate(144)"/>' +
      '<ellipse cx="0" cy="-11" rx="5" ry="10" fill="#93c5fd" transform="rotate(216)"/>' +
      '<ellipse cx="0" cy="-11" rx="5" ry="10" fill="#93c5fd" transform="rotate(288)"/>' +
      '<circle cx="0" cy="0" r="5" fill="#fde047"/>' +
    '</g>' +
  '</svg>';
}
function showResult(){
  const used = new Set();
  const profileHtml = answers.map(function(a,i){
    const slot = profile[i][a];
    const picked = pickBook(slot, used);
    return '<li>' + slot.t + '<div class="book-pick">📖《' + picked.book + '》——' + picked.why + '</div></li>';
  }).join('');
  root.innerHTML = '<div class="card">' + flowerGraphic() +
    '<div class="label">你的潜质画像 + 专属书单</div><ul class="tips profile">' + profileHtml + '</ul>' +
    '<div class="label">关于证书，先说清楚一个坑</div>' +
    '<div class="honest-note">' + certNote + '</div>' +
    '<button class="primary" onclick="showIntro()" style="margin-top:20px;">重新测一次</button>' +
  '</div>';
}
showIntro();
</script>
</body>
</html>
